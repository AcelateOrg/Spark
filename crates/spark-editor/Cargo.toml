[package]
name = "spark-editor"
description = "Spark Editor: project manager, code editor, game runner and live debugger for Spark games."
version.workspace = true
edition.workspace = true
# egui 0.36 needs a newer compiler than the engine (the engine itself stays on rust-version 1.85).
rust-version = "1.95"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "spark-editor"
path = "src/main.rs"

[features]
# Release builds: no console window on Windows.
gui = []

[dependencies]
spark-project.workspace = true
spark-devtools.workspace = true
# The viewport panel runs the game in-process and draws it on egui's GPU device.
engine = { package = "spark", path = "../spark" }
# Same wgpu (30) / winit (0.30) as the engine: the viewport shares egui's GPU device (zero-copy).
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui_dock = "0.21"
rfd = "0.17"
notify = "8"
trash = "5"
dirs = "7"
toml = "1"
sys-locale = "0.3"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true

[target.'cfg(windows)'.dependencies]
# Viewport mouse look: read / pin the OS cursor directly (eframe does not forward raw mouse motion).
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
