[package]
name = "spark-cli"
description = "Spark Engine runner: spark path/to/main.luau"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "spark"
path = "src/main.rs"

[features]
# Release builds for players: no console window on Windows (`cargo build --release -p spark-cli --features gui`).
gui = []

[dependencies]
engine = { package = "spark", path = "../spark" }
# `spark check`: compiles every .luau module (syntax check without running it).
mlua.workspace = true
# `spark build`: exe / .app icons from game.toml `icon`.
image.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }
