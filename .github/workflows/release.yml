name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        shell: pwsh
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
            exit 1
          }

      - name: Test
        run: cargo test --release --workspace

      - name: Build
        run: cargo build --release -p spark-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spark.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath spark-windows-x64.zip -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: spark-windows-x64.zip
          generate_release_notes: true
