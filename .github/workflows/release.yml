# Create a release on GitHub (Releases > Draft a new release, tag v0.1.0) - this attaches spark-windows-x64.zip to it.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p spark-cli

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/spark.exe, LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath spark-windows-x64.zip -Force

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} spark-windows-x64.zip --clobber
